<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Três canais para divulgar uma empresa no Google</title>
  <desc id="desc">Comparação visual entre Google Maps, site com SEO orgânico e Google Ads.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#173246"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="1080" cy="580" r="250" fill="#c9a84c" opacity=".06"/>
  <text x="80" y="96" fill="#dfc06e" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">DIVULGAÇÃO NO GOOGLE</text>
  <text x="80" y="150" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Três espaços, três funções</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow2)">
    <g transform="translate(80 215)">
      <rect width="320" height="330" rx="24" fill="#13283a" stroke="#c9a84c" stroke-opacity=".42"/>
      <path d="M160 48c-38 0-68 30-68 68 0 52 68 115 68 115s68-63 68-115c0-38-30-68-68-68z" fill="none" stroke="#dfc06e" stroke-width="8"/><circle cx="160" cy="116" r="24" fill="#dfc06e" opacity=".9"/>
      <text x="160" y="260" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Maps</text>
      <text x="160" y="296" text-anchor="middle" fill="#b9c5cf" font-size="18">decisão local e “perto de mim”</text>
    </g>
    <g transform="translate(440 215)">
      <rect width="320" height="330" rx="24" fill="#172f3c" stroke="#dfc06e" stroke-width="2"/>
      <rect x="78" y="55" width="164" height="124" rx="12" fill="none" stroke="#dfc06e" stroke-width="8"/><path d="M78 88h164M105 120h110M105 147h72" stroke="#dfc06e" stroke-width="7" stroke-linecap="round"/>
      <path d="M125 204h70" stroke="#dfc06e" stroke-width="9" stroke-linecap="round"/>
      <text x="160" y="260" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Site + SEO</text>
      <text x="160" y="296" text-anchor="middle" fill="#b9c5cf" font-size="18">serviços, dúvidas e demanda contínua</text>
    </g>
    <g transform="translate(800 215)">
      <rect width="320" height="330" rx="24" fill="#13283a" stroke="#c9a84c" stroke-opacity=".42"/>
      <path d="M87 159l126-70v142z" fill="none" stroke="#dfc06e" stroke-width="8" stroke-linejoin="round"/><path d="M92 174l18 52M218 110l28-18M218 210l28 18" stroke="#dfc06e" stroke-width="8" stroke-linecap="round"/>
      <text x="160" y="260" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Google Ads</text>
      <text x="160" y="296" text-anchor="middle" fill="#b9c5cf" font-size="18">exposição rápida enquanto há verba</text>
    </g>
  </g>
  <text x="600" y="614" text-anchor="middle" fill="#f4e4b2" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">A estratégia forte conecta os canais e mede o contato, não apenas a visita.</text>
</svg>
